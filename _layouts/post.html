<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Sharan Salian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans Text', 'Google Sans', -apple-system, sans-serif;
      background: #fff; color: #37352f; line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem; }
    .back {
      display: inline-block; color: #9b9a97; text-decoration: none;
      font-size: 0.8125rem; margin-bottom: 2rem; transition: color 0.15s;
    }
    .back:hover { color: #37352f; }
    h1 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .meta { color: #9b9a97; font-size: 0.8125rem; margin-bottom: 2rem; }
    .post-banner {
      width: 100%; max-height: 400px; object-fit: cover;
      border-radius: 8px; margin-bottom: 2rem;
    }
    .content h2 { font-family: 'Google Sans', sans-serif; font-size: 1.25rem; font-weight: 600; margin: 1.75rem 0 0.5rem; }
    .content h3 { font-family: 'Google Sans', sans-serif; font-size: 1.0625rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .content p { margin-bottom: 1rem; }
    .content ul, .content ol { margin: 0 0 1rem 1.25rem; }
    .content li { margin-bottom: 0.25rem; }
    .content code {
      background: #f7f6f3; padding: 0.125rem 0.375rem; border-radius: 4px;
      font-size: 0.875rem;
    }
    .content pre {
      background: #f7f6f3; border: 1px solid #e3e2de; border-radius: 8px;
      padding: 1rem; overflow-x: auto; margin-bottom: 1rem; font-size: 0.8125rem;
      line-height: 1.6;
    }
    .content pre code { background: none; padding: 0; }
    .content a { color: #2eaadc; text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content blockquote {
      border-left: 3px solid #e3e2de; padding-left: 1rem; color: #787774;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="/">&larr; Back</a>
    <h1>{{ page.title }}</h1>
    <div class="meta">{{ page.date | date: "%B %-d, %Y" }}</div>
    {% if page.image %}
    <img class="post-banner" src="{{ page.image }}" alt="{{ page.title }}" />
    {% endif %}
    <div class="content">
      {{ content }}
    </div>
  </div>
  <script>
    (function() {
      var slug = location.pathname.replace(/^\//,'').replace(/\/$/,'').split('/').pop();
      if (slug) {
        fetch('https://us-central1-sharan-os-core.cloudfunctions.net/trackPageHit?slug=' + encodeURIComponent(slug), { mode: 'no-cors' }).catch(function(){});
      }
    })();
  </script>
</body>
</html>
