---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharan Salian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff; color: #333; line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 4rem 1.5rem 3rem; }

    /* Header */
    .header { margin-bottom: 3rem; }
    .header h1 {
      font-size: 1.5rem; font-weight: 600; color: #111;
      letter-spacing: -0.02em; margin-bottom: 0.25rem;
    }
    .header .tagline {
      color: #888; font-size: 0.9rem; margin-bottom: 0.75rem;
    }
    .header nav {
      display: flex; align-items: center; gap: 1.25rem;
      font-size: 0.85rem;
    }
    .header nav a {
      color: #555; text-decoration: none;
      transition: color 0.15s;
    }
    .header nav a:hover { color: #111; }
    .header nav a svg {
      width: 15px; height: 15px; fill: currentColor;
      vertical-align: -2px;
    }

    /* Posts */
    .posts { list-style: none; }
    .posts li {
      display: flex; align-items: baseline; gap: 1.25rem;
      padding: 0.625rem 0;
    }
    .posts .date {
      font-size: 0.8rem; color: #aaa; white-space: nowrap;
      font-variant-numeric: tabular-nums;
      min-width: 5.5rem;
    }
    .posts a {
      text-decoration: none; color: #333; font-size: 0.95rem;
      font-weight: 450; transition: color 0.15s;
    }
    .posts a:hover { color: #0969da; }
    .empty { color: #aaa; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Sharan Salian</h1>
      <p class="tagline">Engineering, AI, and building in public.</p>
      <nav>
        <a href="https://www.linkedin.com/in/sharan-salian/" target="_blank" rel="noopener" title="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          LinkedIn
        </a>
        <a href="https://github.com/sharansalian" target="_blank" rel="noopener" title="GitHub">
          <svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          GitHub
        </a>
      </nav>
    </div>

    {% if site.posts.size > 0 %}
    <ul class="posts">
      {% for post in site.posts %}
      <li>
        <span class="date">{{ post.date | date: "%b %-d, %Y" }}</span>
        <a href="{{ post.url }}">{{ post.title }}</a>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="empty">No posts yet.</p>
    {% endif %}
  </div>
</body>
</html>
